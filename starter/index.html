<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Sales Report</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 30px;
        }

        figure {
            max-width: 650px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border: 2px solid #1e3a5f;
            border-radius: 10px;
            box-shadow: 0 4px 10px #cccccc;
        }

        figcaption {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #1e3a5f;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #1e3a5f;
            color: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #cccccc;
            text-align: right;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }

        th:nth-child(2),
        td:nth-child(2) {
            text-align: center;
        }

        tbody tr:nth-child(even) {
            background-color: #e8f1fa;
        }

        tbody tr:hover {
            background-color: #d1e5f5;
        }

        tfoot {
            background-color: #d5e8d4;
            font-weight: bold;
            color: #205522;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            figure {
                padding: 10px;
                overflow-x: auto;
            }

            th, td {
                padding: 8px;
                font-size: 13px;
            }

            figcaption {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<figure>
    <figcaption>Book Sales Report</figcaption>

    <table>
        <thead>
            <tr>
                <th>Book</th>
                <th>Year Published</th>
                <th>Sales</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>PHP and MySQL</td>
                <td>2014</td>
                <td>$372,381</td>
            </tr>
            <tr>
                <td>JavaScript and jQuery</td>
                <td>2015</td>
                <td>$305,447</td>
            </tr>
            <tr>
                <td>Java Programming</td>
                <td>2011</td>
                <td>$392,444</td>
            </tr>
            <tr>
                <td>Java Servlets and JSP</td>
                <td>2014</td>
                <td>$328,992</td>
            </tr>
            <tr>
                <td>ASP.NET with Visual Basic</td>
                <td>2011</td>
                <td>$351,200</td>
            </tr>
            <tr>
                <td>ASP.NET with C#</td>
                <td>2011</td>
                <td>$404,332</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>Total Sales</th>
                <td> </td>
                <td>$2,154,796</td>
            </tr>
        </tfoot>
    </table>
</figure>

</body>
</html>
